# PHP CircleCI 2.1 configuration file
#
# Check https://circleci.com/docs/language-php/ for more details
#
version: 2.1

jobs:
  test:
    parameters:
      php-version:
        type: string
    docker:
      - image: cimg/php:<< parameters.php-version >>

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v2-dependencies-<< parameters.php-version >>-{{ checksum "composer.lock" }}

      - run:
          name: Install dependencies
          command: composer install -n --prefer-dist

      - save_cache:
          key: v2-dependencies-<< parameters.php-version >>-{{ checksum "composer.lock" }}
          paths:
            - ./vendor

      # run tests with phpunit
      - run:
          name: Run tests
          command: |
            mkdir -p test-results
            ./vendor/bin/phpunit --bootstrap vendor/autoload.php --log-junit test-results/junit.xml tests

      - store_test_results:
          path: test-results

workflows:
  test:
    jobs:
      - test:
          matrix:
            parameters:
              # lowest supported version and the production version
              php-version: ["7.4.33", "8.4.27"]
